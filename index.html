<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BaseX - Number Base Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <main class="container">

        <header class="header">

            <div class="logo">

                <span class="logo-mark">BX</span>

                <div>
                    <h1>BaseX</h1>
                    <p>NUMBER BASE CONVERTER</p>
                </div>

            </div>

            <div class="status">
                <span class="status-dot"></span>
                Ready
            </div>

        </header>


        <section class="converter-card">

            <div class="card-heading">

                <h2>Number Converter</h2>

                <p>
                    Convert between Binary, Decimal, Octal and Hexadecimal
                </p>

            </div>


            <!-- BINARY -->

            <div class="input-group">

                <label for="binary">

                    <span class="base-number">01</span>

                    Binary

                    <small>Base 2</small>

                </label>


                <div class="input-wrapper">

                    <input
                        type="text"
                        id="binary"
                        placeholder="Enter binary number"
                        autocomplete="off"
                        spellcheck="false"
                    >

                    <span class="base-tag">BIN</span>

                </div>

                <p class="error" id="binary-error"></p>

            </div>


            <!-- DECIMAL -->

            <div class="input-group">

                <label for="decimal">

                    <span class="base-number">10</span>

                    Decimal

                    <small>Base 10</small>

                </label>


                <div class="input-wrapper">

                    <input
                        type="text"
                        id="decimal"
                        placeholder="Enter decimal number"
                        autocomplete="off"
                        spellcheck="false"
                    >

                    <span class="base-tag">DEC</span>

                </div>

                <p class="error" id="decimal-error"></p>

            </div>


            <!-- OCTAL -->

            <div class="input-group">

                <label for="octal">

                    <span class="base-number">08</span>

                    Octal

                    <small>Base 8</small>

                </label>


                <div class="input-wrapper">

                    <input
                        type="text"
                        id="octal"
                        placeholder="Enter octal number"
                        autocomplete="off"
                        spellcheck="false"
                    >

                    <span class="base-tag">OCT</span>

                </div>

                <p class="error" id="octal-error"></p>

            </div>


            <!-- HEXADECIMAL -->

            <div class="input-group">

                <label for="hexadecimal">

                    <span class="base-number">16</span>

                    Hexadecimal

                    <small>Base 16</small>

                </label>


                <div class="input-wrapper">

                    <input
                        type="text"
                        id="hexadecimal"
                        placeholder="Enter hexadecimal number"
                        autocomplete="off"
                        spellcheck="false"
                    >

                    <span class="base-tag">HEX</span>

                </div>

                <p class="error" id="hexadecimal-error"></p>

            </div>


            <!-- BUTTONS -->

            <div class="actions">

                <button
                    type="button"
                    id="convertBtn"
                    class="convert-btn"
                >

                    <span>Convert</span>

                    <span class="arrow">→</span>

                </button>


                <button
                    type="button"
                    id="clearBtn"
                    class="clear-btn"
                >

                    Clear

                </button>

            </div>


            <!-- MESSAGE -->

            <div
                class="message"
                id="message"
                aria-live="polite"
            ></div>

        </section>


        <!-- FOOTER -->

        <footer>

            <span>BaseX</span>
            <span>•</span>
            <span>Binary</span>
            <span>•</span>
            <span>Decimal</span>
            <span>•</span>
            <span>Octal</span>
            <span>•</span>
            <span>Hexadecimal</span>

        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
