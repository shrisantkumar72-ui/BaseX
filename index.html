<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BaseX - Number Base Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated background -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-mark">BX</span>
                <div>
                    <h1>BaseX</h1>
                    <p>NUMBER BASE CONVERTER</p>
                </div>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                Ready
            </div>
        </header>


        <!-- Converter Card -->
        <section class="converter-card">

            <div class="card-heading">
                <div>
                    <h2>Number Converter</h2>
                    <p>Convert between Binary, Decimal, Octal and Hexadecimal</p>
                </div>
            </div>


            <!-- Binary -->
            <div class="input-group">
                <label for="binary">
                    <span class="base-number">01</span>
                    Binary
                    <small>Base 2</small>
                </label>

                <div class="input-wrapper">
                    <input
                        type="text"
                        id="binary"
                        placeholder="Enter binary number"
                        autocomplete="off"
                        spellcheck="false"
                    >

                    <span class="base-tag">BIN</span>
                </div>
